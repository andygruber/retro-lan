; Merged into the image's UT2004.ini on every start.
;   Key=Value    set (several lines with the same key replace the whole list)
;   +Key=Value   add the line if it's missing
;   -Key=Value   remove the line
; Port, server name, passwords, max players and bots come from
; docker-compose.yml / .env and win over this file.

[IpDrv.MasterServerUplink]
; LAN only, but answer the LAN browser (off in the image)
DoUplink=False
UplinkToGamespy=False
SendStats=False
DoLANBroadcast=True

[IpDrv.TcpNetDriver]
; download speed for maps and mods (bytes/s), LAN can take more
MaxClientRate=100000
MaxInternetClientRate=25000
NetServerMaxTickRate=35
LanServerMaxTickRate=45
MaxDownloadSize=0

[Engine.GameReplicationInfo]
AdminName=
AdminEmail=
MessageOfTheDay=Have fun! Map vote: Esc -> Map Voting

[Engine.GameInfo]
; bot skill 0 (Novice) .. 7 (Godlike)
GameDifficulty=3.000000
MaxIdleTime=0

[XGame.xDeathMatch]
GoalScore=30
TimeLimit=15

[XGame.xTeamGame]
GoalScore=60
TimeLimit=20

[XGame.xCTFGame]
GoalScore=5
TimeLimit=20

[xVoting.xVotingHandler]
; built-in map vote: players vote for map *and* game type (GameConfig lines)
bMapVote=True
bKickVote=True
KickPercent=51
bAutoOpen=True
VoteTimeLimit=40
ScoreBoardDelay=5
MidGameVotePercent=50
RepeatLimit=3
bDefaultToCurrentGameType=True
GameConfig=(GameClass="XGame.xDeathMatch",Prefix="DM",Acronym="DM",GameName="DeathMatch",Mutators=,Options=)
GameConfig=(GameClass="XGame.xDeathMatch",Prefix="DM",Acronym="iDM",GameName="InstaGib DeathMatch",Mutators="XGame.MutInstaGib",Options=)
GameConfig=(GameClass="XGame.xTeamGame",Prefix="DM",Acronym="TDM",GameName="Team DeathMatch",Mutators=,Options=)
GameConfig=(GameClass="XGame.xCTFGame",Prefix="CTF",Acronym="CTF",GameName="Capture The Flag",Mutators=,Options=)
GameConfig=(GameClass="XGame.xCTFGame",Prefix="CTF",Acronym="iCTF",GameName="InstaGib CTF",Mutators="XGame.MutInstaGib",Options=)
GameConfig=(GameClass="XGame.xVehicleCTFGame",Prefix="VCTF",Acronym="VCTF",GameName="Vehicle CTF",Mutators=,Options=)
GameConfig=(GameClass="Onslaught.ONSOnslaughtGame",Prefix="ONS",Acronym="ONS",GameName="Onslaught",Mutators=,Options=)
GameConfig=(GameClass="UT2k4Assault.ASGameInfo",Prefix="AS",Acronym="AS",GameName="Assault",Mutators=,Options=)
GameConfig=(GameClass="XGame.xBombingRun",Prefix="BR",Acronym="BR",GameName="Bombing Run",Mutators=,Options=)
GameConfig=(GameClass="XGame.xDoubleDom",Prefix="DOM",Acronym="DOM",GameName="Double Domination",Mutators=,Options=)
GameConfig=(GameClass="SkaarjPack.Invasion",Prefix="DM",Acronym="INV",GameName="Invasion",Mutators=,Options=)

[xVoting.DefaultMapListLoader]
bUseMapList=False
MapNamePrefixes=DM,DOM,CTF,BR,AS,ONS,VCTF
