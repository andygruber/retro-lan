; Merged into the image's UnrealTournament.ini on every start.
;   Key=Value    set (several lines with the same key replace the whole list)
;   +Key=Value   add the line if it's missing
;   -Key=Value   remove the line
; Port, server name, passwords, max players and bots come from
; docker-compose.yml / .env and win over this file.

[Engine.GameEngine]
; LAN only: no master server uplinks (the image announces to ~17 of them)
ServerActors=IpDrv.UdpBeacon
ServerActors=IpServer.UdpServerQuery
ServerActors=UWeb.WebServer

[IpDrv.HTTPDownload]
; clients download missing maps straight from this server, not from
; Laclede's LAN's redirect
RedirectToURL=

[IpDrv.TcpNetDriver]
; download speed for maps and mods (bytes/s), LAN can take more
MaxClientRate=100000

[Engine.GameReplicationInfo]
AdminName=
AdminEmail=
MOTDLine1=Have fun!
MOTDLine2=Map vote: press your MapVote key (asked for when you join)
MOTDLine3=
MOTDLine4=

[Botpack.DeathMatchPlus]
FragLimit=30
TimeLimit=15
; bot skill 0 (Novice) .. 7 (Godlike), also in the other game types
Difficulty=2

[Botpack.TeamGamePlus]
GoalTeamScore=50
TimeLimit=20

[Botpack.CTFGame]
GoalTeamScore=5
TimeLimit=20

[BDBMapVote304.BDBMapVote]
; MapVote 3.04 (mutator BDBMapVote304.BDBMapVote, see MUTATORS in
; docker-compose.yml). bAutoDetect=False: players vote for map *and* game
; type out of the types set to True below. Reference: /app/System/BDBMapVote304.htm
bAutoDetect=False
bDM=True
bTDM=True
bCTF=True
bDOM=True
bAS=False
bLMS=True
VoteTimeLimit=40
ScoreBoardDelay=6
bAutoOpen=True
MidGameVotePercent=50
bKickVote=True
KickPercent=51
RepeatLimit=3
