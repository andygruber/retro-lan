hostname "LAN | Classic Maps"
rcon_password ""
sv_password ""

// LAN
sv_lan 1
sv_region 255
sv_contact ""

// Clients may download custom maps/sounds/models straight from the server
sv_allowdownload 1
sv_allowupload 1
sv_send_resources 1
sv_send_logos 1

// Rates (LAN)
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 101
sv_minupdaterate 30
sys_ticrate 1000
fps_max 1000

// Misc
sv_cheats 0
sv_voiceenable 1
sv_alltalk 0
mp_autokick 0
mp_autoteambalance 1
mp_limitteams 2
mp_flashlight 1
mp_footsteps 1
mp_friendlyfire 1
// full damage to teammates (ReGameDLL default: 0.35 bullets, 0.25 grenades)
ff_damage_reduction_bullets 1
ff_damage_reduction_grenade 1
ff_damage_reduction_other 1
mp_tkpunish 0
mp_fadetoblack 0
mp_forcecamera 0
mp_forcechasecam 0
decalfrequency 60
log on
sv_logbans 0
sv_logecho 1
sv_logfile 1
mapcyclefile mapcycle.txt

// Gameplay
mp_timelimit 30
mp_maxrounds 0
mp_winlimit 0
mp_roundtime 2.5
mp_freezetime 6
mp_buytime 0.25
mp_c4timer 35
mp_startmoney 800
