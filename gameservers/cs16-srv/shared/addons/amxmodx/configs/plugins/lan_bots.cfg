// Bot defaults (lan_bots.amxx). Executed once when the server starts;
// admins can change everything in game with /bots or amxmodmenu > Bots,
// those changes last until the server restarts.
// For a different default on one server, put a copy into
// servers/<name>/addons/amxmodx/configs/plugins/lan_bots.cfg

// bots on (1) or off (0)
lan_bots_enabled 1

// bots fill the teams up to this many players (humans + bots); with more
// humans there are no bots
lan_bots_quota 10

// 0 easy, 1 normal, 2 hard, 3 expert
lan_bots_difficulty 1

// 0 all weapons, 1 pistols only, 2 snipers only, 3 knives only
lan_bots_weapons 0

// radio chatter: 0 normal, 1 minimal, 2 radio only, 3 off
lan_bots_chatter 0

// bots only join once a human is on the server
bot_join_after_player 1
