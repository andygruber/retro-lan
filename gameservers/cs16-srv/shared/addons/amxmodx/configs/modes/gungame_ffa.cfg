// GunGame free-for-all: everyone against everyone, deathmatch style.
// ReGG starts the MapManager vote when someone wins, change right after
mapm_change_type 0

// everyone against everyone. ReGG's FFA mode should set this itself, but
// applies its cvars before it stores the mode (ReGG 0.5.41 bug)
mp_freeforall 1

// random spawn points (from the map's .nav, generated when bots play the
// map; without one the normal spawns are used)
mp_randomspawn 1

// spawn protection: 2 seconds, ends early when moving or shooting
mp_respawn_immunitytime 2
mp_respawn_immunity_effects 1
mp_respawn_immunity_force_unset 1

// bots in this mode (0 = none, whatever /bots says)
lan_bots_allowed 1
