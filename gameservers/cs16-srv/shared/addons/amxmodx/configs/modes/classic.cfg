// Classic mode. Resets ReGameDLL cvars that Deathmatch/GunGame change, in
// case a mode plugin did not restore them.

// Apply this server's server.cfg again (round time, timelimit, buy time, ...):
// on a map change the GunGame plugins restore their saved values after the
// engine ran server.cfg, which can leave e.g. the 30 s warmup round time behind
exec server.cfg

mp_round_infinite 0
mp_forcerespawn 0
mp_respawn_immunitytime 0
mp_randomspawn 0
mp_refill_bpammo_weapons 0
mp_freeforall 0
mp_fraglimit 0
mp_roundover 0
mp_item_staytime 300
mp_buy_anywhere 0
mp_give_player_c4 1
mp_weapons_allow_map_placed 1
mp_free_armor 0
mp_t_give_player_knife 1
mp_ct_give_player_knife 1
mp_t_default_weapons_primary ""
mp_ct_default_weapons_primary ""
mp_t_default_weapons_secondary "glock18"
mp_ct_default_weapons_secondary "usp"
mp_t_default_grenades ""
mp_ct_default_grenades ""

// map vote at the end of the map, change at round end
mapm_change_type 1

// bots in this mode (0 = none, whatever /bots says)
lan_bots_allowed 1

// restart the round so the first round already uses these values
sv_restart 1
