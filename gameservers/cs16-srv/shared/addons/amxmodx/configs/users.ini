; AMX Mod X admins
;
; Easiest: list them in admins.env (CS_ADMINS) in the docker project, they
; are added below this file on every start. Entries here work as well.
;
; With sv_lan 1 every player has the SteamID STEAM_ID_LAN, so authenticate
; by name + password or by IP:
;
;   "<name|ip>" "<password>" "<access flags>" "<account flags>"
;
; Name + password: the player sets the password in the game console once
; (it is saved in the client's config):   setinfo _pw "secret"
;   "Alice" "secret" "abcdefghijklmnopqrstu" "a"
;
; IP (no password):
;   "192.168.1.10" "" "abcdefghijklmnopqrstu" "de"
;
; Access flags: a immunity, b reservation, c kick, d ban, e slay, f map,
; g cvar, h cfg, i chat, j vote, k sv_password, l rcon, m-t custom,
; u menu access. Account flags: a disconnect on bad password,
; b clan tag, c steamid, d ip, e password not checked.
;
; After editing: docker compose restart (or amx_reloadadmins in the console)

