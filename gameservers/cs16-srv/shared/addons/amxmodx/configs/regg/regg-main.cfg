// ReGG (GunGame) settings, used by the gungame and gungame_ffa modes.
// Comments translated from the original Russian; values unchanged.

// GunGame mode of the gungame mode
// 0 - single (two teams, but everyone levels up on their own)
// 1 - team (the whole team shares one level)
// 2 - FFA (does not work in ReGG 0.5.41, use the gungame_ffa mode instead,
//     which ignores this setting)
regg_mode "0"

// Knife Pro: a knife kill steals levels or points from the victim
// 0 - off
// 1 - steal the number of levels set in regg_steal_value
// 2 - steal the number of points set in regg_steal_value
// 3 - steal the points needed for the level, from regg-levels.ini (points)
regg_steal_mode "1"

// Number of levels or points stolen (Knife Pro)
regg_steal_value "1"

// Points gained by a knife kill (with regg_steal_mode on) carry over to the
// next level. Example: you are at 3/4 and steal 3 points from an opponent;
// on the new level you have 2/4, with this off 0/4.
// Not on the knife and grenade levels, there it is always 0 on level-up.
// 0 - off
// 1 - on
regg_rolling_points "1"

// Which plugin changes the map when someone wins
// 0 - ReGG Map Manager, a random map from the maplist (maps.ini or mapcycle.txt)
// 1 - Map Manager by Mistrick (v. 3.0.7) - used here, starts the map vote
// 2 - MapChooser RBS by SKAJIbnEJIb
// 3 - Map Manager by Mistrick (v. 2.5.61)
regg_mapchange_type "1"

// The AWP has 1 shot, reloaded if it did not kill
regg_awp_oneshot "1"

// Ammo given for each weapon
regg_ammo_amount "200"

// Refill the magazine on a kill
regg_refill_on_kill "1"

// Armor on spawn
// 0 - no armor
// 1 - armor only
// 2 - armor and helmet
//
regg_free_armor 0

// Warmup time in seconds
regg_warmup_time "30"

// Warmup type
// 0 - all weapons
// 1 - knives only
//
regg_warmup_type "1"

// Remove map objectives: hostages, buy zones, etc.
regg_block_map_conditions "1"

// Show the winner at the end of the game
// 0 - in chat
// 1 - HUD
regg_show_winner "0"

// HUD color of the winner message
regg_show_winner_hud_color "255 255 255"

// HUD position of the winner message
regg_show_winner_hud_pos "-1.0 0.65"

// How long the winner message is shown (seconds)
regg_show_winner_time "15"
